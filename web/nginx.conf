# Nginx config for the HR Portal (served inside the "web" container).
#
# One origin for everything:
#   /            -> React static files (SPA fallback to index.html)
#   /api/...     -> Spring Boot backend  (container "backend", port 7060)
#   /ws          -> Spring Boot WebSocket/SockJS (same backend)
#   /analytics/  -> Python FastAPI analytics service (container "analytics", port 8082)
#
# Because the browser only ever talks to THIS origin, CORS never comes into play.
#
# HTTPS matters beyond privacy here: browsers expose the microphone (voice notes)
# and GPS (attendance punches) only in a secure context, so on plain HTTP those
# features cannot work at all. The 443 block below is commented out until a
# certificate exists — see the SSL section of EC2_DEPLOYMENT_GUIDE.md.

# The exact nginx version in every response tells an attacker which published
# vulnerabilities to try first. It buys them time and buys us nothing: the
# version still has to be patched, and hiding it does not patch anything. But
# there is no reason to print it. Set once here rather than per server block --
# unlike add_header, this one is inherited.
server_tokens off;

upstream hrp_backend {
    server backend:7060;
    # Hold idle connections open so an API call does not pay for a fresh
    # TCP handshake. The backend is one container away, but a handshake is
    # still a round trip that buys nothing.
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match spring.servlet.multipart.max-request-size — chat attachments may be a
    # batch of files, so a single request can be larger than any one file.
    client_max_body_size 5g;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;

    # Let certbot answer the ACME challenge over port 80 while renewing.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- Backend REST API ----------
    location /api/ {
        proxy_pass http://hrp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A multi-gigabyte video takes minutes on an ordinary connection, and
        # streaming it straight to the backend rather than spooling the whole
        # request to disk here first keeps the web container small.
        proxy_request_buffering off;
        client_body_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # ---------- Backend WebSocket (STOMP/SockJS notifications + chat) ----------
    location /ws {
        proxy_pass http://backend:7060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle sockets open
    }

    # ---------- Python analytics / face-recognition service ----------
    # Uses a runtime-resolved variable so Nginx still starts even if the
    # analytics container is stopped or not deployed (the dashboard degrades
    # gracefully). 127.0.0.11 is Docker's embedded DNS.
    location /analytics/ {
        resolver 127.0.0.11 valid=30s;
        set $analytics_upstream http://analytics:8082;
        # /analytics/api/... -> /api/... on the service
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass $analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;    # face encoding / OCR can be slow
        client_max_body_size 10m;
    }

    # ---------- Serving payslip PDFs / QR / uploaded files ----------
    # (backend serves them under /api/files, already covered by /api/ above)

    # ---------- React SPA ----------
    #
    # Everything that is not the ACME challenge goes to HTTPS. The challenge
    # location above is declared before this and still wins, which is what keeps
    # renewal working — redirecting it would break renewal, and a certificate
    # that cannot renew takes the site down ninety days later with no warning.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
#
# This block was commented out and the site ran on port 80 only. Certbot had
# been run against the container at some point, which worked until the container
# was recreated — a container's filesystem does not survive that, so the config
# went back to the image default and nothing listened on 443 any more. The
# symptom was "Network Error" in the browser: not a refusal, no response at all.
#
# Living here instead means it is rebuilt into the image every deploy and cannot
# be lost that way again. The certificate itself stays on the host and is
# mounted read-only — see docker-compose.prod.yml.
server {
    listen 443 ssl;
    http2 on;
    server_name pixoushrportal.pixous.info;

    ssl_certificate     /etc/letsencrypt/live/pixoushrportal.pixous.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixoushrportal.pixous.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    #
    # Everyone using this is about 7,000 km from it, and that distance is the
    # single largest thing in a page load: measured from Coimbatore, a request
    # on a fresh connection answers in ~530ms and the same request on an
    # already-open one answers in ~170ms. The 360ms difference is not the
    # server thinking, it is packets crossing Europe three times to agree on
    # encryption. Everything below is about not paying that agreement again.
    #

    # Resume an earlier session instead of negotiating a new one. A returning
    # browser skips a full round trip; without tickets, only the shared cache
    # above can resume, and it is lost whenever nginx restarts.
    ssl_session_tickets on;

    # TLS 1.3 lets a known client send its first request together with the
    # handshake. That is the round trip that early data removes.
    ssl_early_data on;

    # OCSP stapling is deliberately not set. It would save the browser a
    # separate trip to a certificate authority on first load, but Let's Encrypt
    # stopped putting a responder URL in its certificates, so nginx ignores the
    # directive and logs a warning on every start. A setting that does nothing
    # but produce a warning is worse than no setting.

    # Hold idle connections open far longer than the default 75s. A person
    # reading a payslip for two minutes and then tapping something should not
    # pay for a new handshake because of the pause.
    keepalive_timeout 300s;
    keepalive_requests 1000;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5g;

    # ---------- Security headers ----------
    #
    # The API already sends these: Spring Security puts nosniff and
    # X-Frame-Options on every response it writes. The pages did not -- nginx
    # serves index.html and the bundles itself, so the actual application
    # loaded in the browser arrived with no headers at all and could be framed
    # by any site.
    #
    # "always" so they are sent on error responses too, not just 200s. No
    # location declares its own add_header, so these inherit everywhere.
    #
    # Deliberately NOT set here: Content-Security-Policy. A policy strict enough
    # to be worth having would have to allow the inline styles, blob: workers
    # and data: images this app genuinely uses, and getting it wrong breaks
    # pages silently rather than loudly. It is worth doing as its own change,
    # rolled out in Report-Only first.
    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # 180 days rather than the customary year: long enough to matter, short
    # enough that a lapsed certificate does not lock users out for a year.
    # No preload -- that is effectively irreversible.
    add_header Strict-Transport-Security  "max-age=15552000"                always;
    # Hardware this app never asks for. Unlike CSP this cannot break a page by
    # being too strict -- it only withholds permission prompts the app does not
    # raise. Camera and microphone are left to the same origin because the
    # portal's own calling and face-punch need them.
    add_header Permissions-Policy
        "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # Report-Only, as the note above said it should be.
    #
    # The app genuinely loads a script from js.puter.com, images from Unsplash
    # and transparenttextures, geocodes against nominatim.openstreetmap.org,
    # and builds blob: workers and data: images -- so an enforcing policy would
    # break pages silently. This one blocks nothing: it reports what a policy
    # WOULD have blocked, so the list can be corrected from evidence before
    # anything is enforced. Turning it into a real Content-Security-Policy is
    # the follow-up, once the reports are quiet.
    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.puter.com https://translate.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://js.puter.com wss: ws:; worker-src 'self' blob:; media-src 'self' blob: data:" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;

    # ---------- Backend REST API ----------
    location /api/ {
        proxy_pass http://hrp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_body_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # ---------- Backend WebSocket (STOMP/SockJS notifications + chat) ----------
    #
    # The mobile app connects here over wss://. Without the Upgrade headers the
    # handshake is answered as an ordinary request and the socket never opens —
    # chat and notifications would simply never arrive, with nothing logged.
    location /ws {
        proxy_pass http://backend:7060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---------- Python analytics / face-recognition service ----------
    location /analytics/ {
        resolver 127.0.0.11 valid=30s;
        set $analytics_upstream http://analytics:8082;
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass $analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # ---------- Static assets ----------
    #
    # Everything under /assets carries a content hash in its filename, so a
    # given URL can never change meaning: a new build is a new filename. That
    # makes it safe to tell the browser to keep it for a year and never ask
    # again, which is what "immutable" says.
    #
    # Nothing said anything before, so every asset was revalidated on every
    # visit -- a round trip each, before a single pixel could be drawn, for
    # files that were already on disk and already correct.
    #
    # The security headers are repeated because nginx does not merge
    # add_header across levels: a location that declares one of its own drops
    # every add_header it would otherwise have inherited. Leaving them out
    # here would quietly strip nosniff and HSTS from the bundles.
    #
    # Fonts, cached like assets.
    #
    # They live in /fonts rather than /assets because they are copied verbatim
    # from public/ and carry no content hash, so the year-long immutable rule
    # below would not have matched them -- and a font re-fetched on every visit
    # defeats the point of self-hosting it. The names come from Google and
    # already contain a version, so they are safe to treat as immutable.
    #
    location ~* ^/fonts/ {
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Strict-Transport-Security  "max-age=15552000"                always;
    # Hardware this app never asks for. Unlike CSP this cannot break a page by
    # being too strict -- it only withholds permission prompts the app does not
    # raise. Camera and microphone are left to the same origin because the
    # portal's own calling and face-punch need them.
    add_header Permissions-Policy
        "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # Report-Only, as the note above said it should be.
    #
    # The app genuinely loads a script from js.puter.com, images from Unsplash
    # and transparenttextures, geocodes against nominatim.openstreetmap.org,
    # and builds blob: workers and data: images -- so an enforcing policy would
    # break pages silently. This one blocks nothing: it reports what a policy
    # WOULD have blocked, so the list can be corrected from evidence before
    # anything is enforced. Turning it into a real Content-Security-Policy is
    # the follow-up, once the reports are quiet.
    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.puter.com https://translate.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://js.puter.com wss: ws:; worker-src 'self' blob:; media-src 'self' blob: data:" always;
        add_header Cache-Control              "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/assets/ {
        add_header X-Frame-Options            "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security  "max-age=15552000"                always;
    # Hardware this app never asks for. Unlike CSP this cannot break a page by
    # being too strict -- it only withholds permission prompts the app does not
    # raise. Camera and microphone are left to the same origin because the
    # portal's own calling and face-punch need them.
    add_header Permissions-Policy
        "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # Report-Only, as the note above said it should be.
    #
    # The app genuinely loads a script from js.puter.com, images from Unsplash
    # and transparenttextures, geocodes against nominatim.openstreetmap.org,
    # and builds blob: workers and data: images -- so an enforcing policy would
    # break pages silently. This one blocks nothing: it reports what a policy
    # WOULD have blocked, so the list can be corrected from evidence before
    # anything is enforced. Turning it into a real Content-Security-Policy is
    # the follow-up, once the reports are quiet.
    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.puter.com https://translate.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://js.puter.com wss: ws:; worker-src 'self' blob:; media-src 'self' blob: data:" always;
        add_header Cache-Control              "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------- Things that must never be held on to ----------
    #
    # index.html names which hashed bundles to load, and sw.js decides when the
    # app updates. Cache either one and the browser keeps running the old
    # release: the assets above would be permanently correct and permanently
    # unreachable, because nothing would ever learn their new names. This is
    # the pairing that makes the year-long cache above safe.
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header X-Frame-Options            "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security  "max-age=15552000"                always;
    # Hardware this app never asks for. Unlike CSP this cannot break a page by
    # being too strict -- it only withholds permission prompts the app does not
    # raise. Camera and microphone are left to the same origin because the
    # portal's own calling and face-punch need them.
    add_header Permissions-Policy
        "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # Report-Only, as the note above said it should be.
    #
    # The app genuinely loads a script from js.puter.com, images from Unsplash
    # and transparenttextures, geocodes against nominatim.openstreetmap.org,
    # and builds blob: workers and data: images -- so an enforcing policy would
    # break pages silently. This one blocks nothing: it reports what a policy
    # WOULD have blocked, so the list can be corrected from evidence before
    # anything is enforced. Turning it into a real Content-Security-Policy is
    # the follow-up, once the reports are quiet.
    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.puter.com https://translate.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://js.puter.com wss: ws:; worker-src 'self' blob:; media-src 'self' blob: data:" always;
        add_header Cache-Control              "no-cache"                        always;
        try_files $uri =404;
    }


    # ---------- Static media ----------
    #
    # The login video, its poster, the logo and the PWA icons carried no
    # cache header at all, so every visit re-fetched 3.3 MB that had not
    # changed. These names are not content-hashed the way /assets/ are, so
    # a year would be too long: a week makes a repeat visit free while a
    # replaced logo still appears without anybody clearing a cache.
    # Not /api/ -- an uploaded photograph is served by the backend out of the
    # database, and its URL ends in .png like any other image. A regex
    # location beats a prefix one in nginx, so this rule was matching
    # /api/files/... ahead of the proxy and answering try_files with a 404
    # against the static root, where no upload has ever lived. Every attached
    # image in the portal was a broken icon.
    location ~* ^(?!/api/).*\.(?:mp4|webm|jpg|jpeg|png|gif|svg|webp|ico)$ {
        add_header X-Frame-Options            "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security  "max-age=15552000"                always;
        add_header Cache-Control              "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }

    # ---------- React SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
